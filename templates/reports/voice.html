{% extends 'reports/base.html' %}

{% block content %}
<div class="container">
  <h2 style="font-size:28px;font-weight:700;color:#0F6E56;margin-bottom:8px">
    🎤 Voice Health Assistant
  </h2>
  <p style="color:#777;margin-bottom:28px">
    Speak about your health problem
  </p>

  <div class="card">
    <form method="POST" id="voiceForm">
      {% csrf_token %}

      <!-- Language -->
      <div style="margin-bottom:30px">
        <label style="font-size:14px;font-weight:600;color:#333">🌍 Language</label>
        <select id="lang" name="language" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px">
          <option value="en-US">English</option>
          <option value="hi-IN">Hindi</option>
          <option value="mr-IN">Marathi</option>
          <option value="bn-IN">Bengali</option>
          <option value="ta-IN">Tamil</option>
          <option value="te-IN">Telugu</option>
        </select>
      </div>

      <!-- Button -->
      <div style="margin-bottom:30px;text-align:center">
        <button type="button" id="btn" onmousedown="start()" onmouseup="stop()" ontouchstart="start()" ontouchend="stop()"
          style="width:100%;padding:40px;background:#1D9E75;color:white;border:none;border-radius:10px;font-size:24px;font-weight:700;cursor:pointer">
          🎤 HOLD & SPEAK
        </button>
      </div>

      <!-- Text -->
      <div style="margin-bottom:30px">
        <textarea id="result" name="symptoms" style="width:100%;height:120px;padding:10px;border:1px solid #ddd;border-radius:6px" placeholder="Your speech will appear here..."></textarea>
      </div>

      <button type="submit" style="width:100%;padding:12px;background:#0F6E56;color:white;border:none;border-radius:6px;font-weight:600;cursor:pointer">
        🤖 Get Health Guidance
      </button>
    </form>
  </div>
</div>

<script>
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  alert('Speech not supported');
}

let r = new SpeechRecognition();
r.continuous = true;
r.interimResults = true;

let final = '';

r.onresult = function(e) {
  let interim = '';
  for (let i = e.resultIndex; i < e.results.length; i++) {
    let t = e.results[i][0].transcript;
    if (e.results[i].isFinal) {
      final += t + ' ';
    } else {
      interim += t;
    }
  }
  document.getElementById('result').value = final + interim;
};

r.onerror = function(e) {
  console.log('Error: ' + e.error);
};

function start() {
  final = '';
  document.getElementById('result').value = '';
  r.lang = document.getElementById('lang').value;
  r.start();
}

function stop() {
  r.stop();
}
</script>

{% endblock %}
